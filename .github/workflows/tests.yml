name: Validation and manuscript build

on:
  push:
    branches:
      - submission6-scientific-audit-revision
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python 3.11 / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit and integration tests
        run: python -m pytest -v

  manuscript:
    name: Build LaTeX manuscript and Overleaf bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Package source, figures, and rendered PDF
        working-directory: paper
        run: |
          test -s main.pdf
          zip -r VeriGeo_Overleaf_Submission.zip main.tex references.bib figures main.pdf
          test -s VeriGeo_Overleaf_Submission.zip

      - name: Upload manuscript deliverables
        uses: actions/upload-artifact@v4
        with:
          name: verigeo-manuscript-and-overleaf-bundle
          path: |
            paper/main.pdf
            paper/VeriGeo_Overleaf_Submission.zip
          if-no-files-found: error
