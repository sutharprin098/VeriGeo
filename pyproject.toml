[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verigeo"
version = "1.0.0"
description = "VeriGeo (NS-VGP 1.0): Runtime pre-checks and repair for selected spatial GIS operations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Prince Suthar"}
]
keywords = [
  "GeoAI",
  "Autonomous GIS",
  "Neuro-Symbolic AI",
  "MAUP",
  "Pycnophylactic Interpolation",
  "Spatial Verification Record",
  "GIScience"
]
dependencies = [
  "numpy>=1.24.0",
  "geopandas>=0.14.0",
  "shapely>=2.0.0",
  "pyproj>=3.6.0",
  "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
]

[project.scripts]
verigeo = "verigeo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["verigeo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
